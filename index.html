<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STM32 OTA Yükleme</title>
<style>
  body{font-family:system-ui,Arial,sans-serif;max-width:560px;margin:24px auto;padding:0 16px;color:#222}
  h1{font-size:1.3rem}
  label{display:block;margin:14px 0 4px;font-weight:600}
  input[type=password],input[type=file]{width:100%;box-sizing:border-box;padding:8px}
  button{margin-top:18px;padding:10px 18px;font-size:1rem;cursor:pointer}
  #log{white-space:pre-wrap;background:#f4f4f4;border-radius:6px;padding:10px;margin-top:18px;min-height:60px;font-family:monospace;font-size:.9rem}
  .ok{color:#0a7a2f}.err{color:#b00020}
  small{color:#666}
</style>
</head>
<body>
<h1>STM32 OTA – Yeni sürüm yükle</h1>
<p><small>Seçtiğin .bin dosyası GitHub'a yüklenir ve <code>latest.json</code> otomatik güncellenir. ESP32 yeni sürümü kendisi bulup STM32'ye gönderir.</small></p>

<label for="tok">GitHub anahtarı (token)</label>
<input id="tok" type="password" autocomplete="off" placeholder="github_pat_...">
<small>Anahtar yalnızca bu tarayıcı sekmesinde durur, hiçbir yere kaydedilmez.</small>

<label for="f">Firmware dosyası (ör. led_v5.bin)</label>
<input id="f" type="file" accept=".bin">

<button id="go">Yükle</button>
<div id="log"></div>

<script>
const OWNER = "gormusoglugamze", REPO = "ota-firmware", BRANCH = "main";
const MAX_SIZE = 0x1BC00;                       // uygulama alanı: 0x08004000 - 0x0801FC00
const NAME_RE = /^[A-Za-z0-9_\-]+_v(\d+)\.bin$/;
const API = "https://api.github.com/repos/" + OWNER + "/" + REPO + "/contents/";

const logEl = document.getElementById("log");
function log(m, cls){ const s=document.createElement("div"); if(cls) s.className=cls; s.textContent=m; logEl.appendChild(s); }

// CRC32 (zlib ile aynı)
const T = new Uint32Array(256);
for (let i=0;i<256;i++){ let c=i; for(let k=0;k<8;k++) c = (c&1) ? (0xEDB88320 ^ (c>>>1)) : (c>>>1); T[i]=c>>>0; }
function crc32(u8){ let c=0xFFFFFFFF; for(let i=0;i<u8.length;i++) c = T[(c^u8[i])&0xFF] ^ (c>>>8); return ((c^0xFFFFFFFF)>>>0).toString(16).padStart(8,"0"); }

function b64(u8){ let s=""; for(let i=0;i<u8.length;i+=0x8000) s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000)); return btoa(s); }
function b64text(t){ return b64(new TextEncoder().encode(t)); }

async function gh(path, opt, token){
  const r = await fetch(API+path, Object.assign({headers:{
    "Authorization":"Bearer "+token, "Accept":"application/vnd.github+json"}}, opt));
  return r;
}
async function put(path, contentB64, msg, token){
  let sha;
  const g = await gh(path+"?ref="+BRANCH, {cache:"no-store"}, token);
  if (g.ok) sha = (await g.json()).sha;
  else if (g.status !== 404) throw new Error("Okuma hatası "+g.status+" ("+path+")");
  const body = {message:msg, content:contentB64, branch:BRANCH}; if (sha) body.sha = sha;
  const r = await gh(path, {method:"PUT", body:JSON.stringify(body)}, token);
  if (!r.ok) throw new Error("Yazma hatası "+r.status+" ("+path+"): "+(await r.text()).slice(0,200));
}

document.getElementById("go").onclick = async () => {
  logEl.textContent = "";
  const token = document.getElementById("tok").value.trim();
  const file = document.getElementById("f").files[0];
  if (!token) return log("Önce GitHub anahtarını yaz.","err");
  if (!file)  return log("Önce bir .bin dosyası seç.","err");
  const m = NAME_RE.exec(file.name);
  if (!m) return log("Dosya adı led_v5.bin gibi olmalı (sonunda _v<sayı>.bin).","err");
  if (file.size < 1024 || file.size > MAX_SIZE) return log("Dosya boyutu uygun değil: "+file.size+" bayt (en fazla "+MAX_SIZE+").","err");
  const data = new Uint8Array(await file.arrayBuffer());
  const info = {version:parseInt(m[1],10), name:file.name, size:data.length, crc32:crc32(data)};
  log("Sürüm: "+info.version+"  Boyut: "+info.size+" bayt  CRC32: "+info.crc32);
  document.getElementById("go").disabled = true;
  try{
    log("1/2 Dosya yükleniyor...");
    await put("firmware/"+file.name, b64(data), "Yeni firmware: "+file.name, token);
    log("2/2 latest.json güncelleniyor...");
    await put("latest.json", b64text(JSON.stringify(info)+"\n"), "Sürüm "+info.version+" yayınlandı", token);
    log("TAMAM. ESP32 bir sonraki kontrolde (birkaç dakika içinde, GitHub önbelleği yüzünden) yeni sürümü alacak.","ok");
  }catch(e){ log(String(e.message||e),"err"); }
  document.getElementById("go").disabled = false;
};
</script>
</body>
</html>
